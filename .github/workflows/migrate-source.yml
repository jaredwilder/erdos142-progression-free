name: One-shot source migration

on:
  push:
    paths:
      - '.github/workflows/migrate-source.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy exact #142 sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jaredwilder/erdos-theorems.git /tmp/theorems
          git clone --depth 1 https://github.com/jaredwilder/ck-gold-and-r3-envelope.git /tmp/ck
          mkdir -p structural finite-envelope
          cp -R /tmp/theorems/erdos142-ap-free/. structural/
          cp -R /tmp/ck/erdos142-envelope/. finite-envelope/
          rm .github/workflows/migrate-source.yml
          git config user.name "Jared Wilder release migration"
          git config user.email "jared@jaredwilder.com"
          git add -A
          git commit -m "Migrate exact Erdős 142 structural and finite-envelope sources"
          git push
